<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f2a5c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>Resume Tailor</title>
<style>
:root{--n:#1f2a5c;--bg:#f3f1ec;--c:#fff;--t:#1b1d29;--m:#656a7c;--b:#dcdad2;--ok:#1b7a45;--bad:#b03a2e}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--c:#1b1e2a;--t:#e8eaf2;--m:#9aa0b6;--b:#2c3042;--n:#93a5ff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 Georgia,'Times New Roman',serif;background:var(--bg);color:var(--t);padding:0 0 74px}
main{padding:12px;max-width:720px;margin:auto}.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 6px;color:var(--n)}label{display:block;font:12px system-ui,sans-serif;color:var(--m);margin:9px 0 3px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif}textarea{min-height:110px}
button{background:var(--n);color:var(--bg);border:0;border-radius:6px;padding:10px 14px;font:600 14px system-ui,sans-serif;margin:8px 6px 0 0}button.g{background:none;color:var(--n);border:1px solid var(--n)}button:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:13px 0;font:12px system-ui,sans-serif;color:var(--m)}nav a.on{color:var(--n);font-weight:700;box-shadow:inset 0 3px var(--n)}
.tab{display:none}.tab.on{display:block}li{margin:4px 0}.s{font:12px system-ui,sans-serif;color:var(--m)}pre{white-space:pre-wrap;font:14px Georgia,serif;margin:4px 0}
.big{font-size:34px;color:var(--n)}.ok{color:var(--ok)}.bad{color:var(--bad)}#toast{position:fixed;left:12px;right:12px;bottom:80px;background:#222;color:#fff;padding:10px;border-radius:6px;display:none;font:14px system-ui}
#sb{position:sticky;top:0;z-index:5;display:none;align-items:center;gap:8px;padding:10px 12px;margin:-12px -12px 12px;font:14px system-ui,sans-serif;color:#fff;background:#444}#sb.work{background:var(--n);color:var(--bg)}#sb.ok{background:var(--ok)}#sb.err{background:var(--bad)}#sb.warn{background:#9a6b00}
.sp{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.rv{font:12px/1.35 'EB Garamond',Garamond,Georgia,serif;overflow-x:auto}.rv table{width:100%;border-collapse:collapse;margin:0}.rv td{border:.5px solid #808080;padding:1px 4px;vertical-align:middle}.rv td.l{width:14%;text-align:center;font-weight:700}.rv tr.t td{background:#f2f2f2;color:#111}.rv tr.t span{float:right;margin-left:12px;font-weight:700}.rv .rh{display:flex;justify-content:space-between}.rv .nm{font-size:18px;font-variant:small-caps}.rv .rs{display:flex;justify-content:space-between;font-weight:700;font-variant:small-caps;border-bottom:3px solid #1f2a5c;margin-top:6px}
</style></head><body><main><div id="sb"></div>
<section id="t-tailor" class="tab on">
<div class="card"><h2>Job</h2><label>Company</label><input id="co"><label>Role</label><input id="rl"><label>Job link</label><input id="lk" type="url"><label>Contact name</label><input id="ct">
<label>Job description</label><textarea id="jd"></textarea><label>Or add screenshots</label><input id="jdimg" type="file" accept="image/*" multiple>
<button id="bfit" data-msg="Checking fit…" data-ok="Fit check done">Check fit</button><button id="bfc" class="g" data-msg="Copying…">Check fit in Claude</button><button id="btl" data-msg="Tailoring…" data-ok="Tailored and saved as a version">Tailor</button><button id="bcl" class="g" data-msg="Preparing prompt…">Use Claude instead</button><button id="bjd" class="g" data-msg="Copying…">Copy JD-extraction prompt</button><div class="s" id="usage"></div></div>
<div class="card" id="pastebox" style="display:none"><label>Paste Claude's JSON reply</label><textarea id="paste"></textarea><button id="bapply" data-msg="Applying reply…" data-ok="Reply applied">Apply reply</button><textarea id="pcopy" readonly style="display:none;min-height:80px"></textarea></div>
<div id="out"></div></section>
<section id="t-resume" class="tab"><div class="card"><h2>Import resume</h2><input id="rf" type="file" accept=".pdf,.docx,image/*"><label>…or paste text</label><textarea id="rt"></textarea><button id="bimp" data-msg="Reading resume…" data-ok="Resume imported. Check the Master preview below.">Import with Gemini</button><button id="bic" class="g" data-msg="Copying…">Use Claude instead</button><div class="s" id="rinfo"></div><label>Paste Claude's JSON reply</label><textarea id="ipaste" style="min-height:70px"></textarea><button id="bia" class="g" data-msg="Applying reply…" data-ok="Reply applied">Apply reply</button></div>
<div class="card"><h2>Master preview</h2><div id="pvm"></div><button id="pmp" data-msg="Building PDF…" data-ok="PDF ready">PDF</button><button id="pmd" data-msg="Building DOCX…" data-ok="DOCX ready">DOCX</button></div>
<div class="card"><h2>Original preview</h2><div id="pvo"></div><button id="pop" data-msg="Building PDF…" data-ok="PDF ready">PDF</button><button id="pod" data-msg="Building DOCX…" data-ok="DOCX ready">DOCX</button></div>
<div class="card"><h2>Edit resume</h2><select id="vs"></select><button id="bsv" class="g">Save copy as version</button><button id="bvo" class="g">Open in Tailor</button><button id="bvd" class="g">Delete version</button><div id="ef"></div><details><summary class="s">Advanced: JSON</summary><textarea id="mj" style="min-height:260px;font:12px monospace"></textarea><button id="bsm">Apply JSON</button></details><button id="bro" class="g">Reset Master to Original</button></div></section>
<section id="t-wins" class="tab"><div class="card"><h2>Log a win</h2><label>What you did</label><textarea id="wt"></textarea><label>Year</label><input id="wy" inputmode="numeric"><button id="bw" data-msg="Reading your win…" data-ok="Suggestion ready">Suggest resume line</button><button id="bu" class="g">Undo last add</button></div><div id="wl"></div></section>
<section id="t-apps" class="tab"><div class="card"><h2>Applications</h2><button id="ba">Add application</button><button id="bcsv" class="g">Export CSV</button></div><div id="al"></div></section>
<section id="t-set" class="tab"><div class="card"><h2>Your details</h2><label>Your name (used in file names)</label><input id="s-name"><label>Phone</label><input id="s-phone"><label>Email</label><input id="s-email"><label>LinkedIn</label><input id="s-linkedin" placeholder="linkedin.com/in/…"><label>File name style</label><select id="fs"><option value="under">Underscores: Name_Resume_Company</option><option value="space">Spaces: Name Resume Company</option></select>
<h2 style="margin-top:14px">Gemini</h2><label>API key (free, from aistudio.google.com)</label><div class="s" id="keyst"></div><input id="key" type="password" autocomplete="off" placeholder="Paste a new key to replace the saved one">
<label>Max tighten spacing (pt, 0 = off)</label><input id="tg" inputmode="decimal"><label>Max stretch spacing (pt, 0 = off)</label><input id="st" inputmode="decimal"><button id="bset" data-msg="Saving…" data-ok="Settings saved">Save settings</button><button id="btk" class="g" data-msg="Testing key…">Test key</button></div>
<div class="card"><h2>Backup</h2><button id="bex">Export JSON</button><button id="bim" class="g">Import JSON</button><input id="bf" type="file" accept=".json" style="display:none"><div class="s">The API key is never included in backups.</div></div></section>
</main><nav><a data-t="tailor" class="on">Tailor</a><a data-t="resume">Resume</a><a data-t="wins">Wins</a><a data-t="apps">Apps</a><a data-t="set">Settings</a></nav><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('rt',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const kv=async(m,k,v)=>{const d=await dbp;return new Promise((res,rej)=>{const o=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv'),q=m==='get'?o.get(k):o.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
let S={orig:null,master:null,wins:[],apps:[],usage:{d:'',n:0},cfg:{key:'',tight:.3,stretch:1.3,cpl:118,name:'',phone:'',email:'',linkedin:'',fileStyle:'under'},undo:[],last:null,versions:[],lastId:null,models:null};
const save=()=>kv('put','state',S);let tt;
let TO;const status=(m,k='')=>{const e=$('#sb');clearTimeout(TO);e.className=k;e.innerHTML=(k==='work'?'<span class="sp"></span>':'')+esc(m);e.style.display=m?'flex':'none';if(k==='ok')TO=setTimeout(()=>e.style.display='none',7000)},toast=m=>status(m,'ok');
addEventListener('unhandledrejection',e=>status('Unexpected error: '+(e.reason?.message||e.reason),'err'));
let LOCK=0;const busy=async(b,f)=>{if(LOCK)return;LOCK=1;b.disabled=true;status(b.dataset.msg||'Working…','work');try{const r=await f();r&&typeof r==='object'?status(r.m,r.k):status(typeof r==='string'?r:(b.dataset.ok||'Done'),'ok')}catch(e){status(e.message||String(e),'err');console.error(e)}LOCK=0;b.disabled=false};
/* ---------- Gemini ---------- */
const parseJSON=t=>JSON.parse(t.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim());
const KEYH=()=>({'x-goog-api-key':S.cfg.key});
async function http(url,opt={},ms=90000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);let r;try{r=await fetch(url,{...opt,signal:c.signal})}catch(e){clearTimeout(t);throw new Error(e.name==='AbortError'?`Timed out after ${ms/1000}s waiting for Gemini`:'Network error: '+(e.message||e))}clearTimeout(t);
 const tx=await r.text();let j=null;try{j=JSON.parse(tx)}catch(e){}
 if(!r.ok){const e=new Error(`HTTP ${r.status}${j?.error?.status?' '+j.error.status:''}: ${j?.error?.message||tx.slice(0,300)||r.statusText}`);e.status=r.status;throw e}return j}
async function pickModels(force){
 if(!S.cfg.key)throw new Error('Add your Gemini key in Settings');if(!force&&S.models&&Date.now()-S.models.t<864e5)return S.models;
 const j=await http('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:KEYH()},30000),
 ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/','')),
 ver=n=>parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[0,0])[1]),bad=/image|tts|live|audio|exp|thinking|robotics|computer|custom/,
 rank=a=>a.sort((x,y)=>ver(y)-ver(x)||(/preview/.test(x)?1:0)-(/preview/.test(y)?1:0)||x.length-y.length),
 fl=ok.filter(n=>/gemini/.test(n)&&/flash/.test(n)&&!bad.test(n)),best=rank(fl.filter(n=>!/lite/.test(n)))[0],lite=rank(fl.filter(n=>/lite/.test(n)))[0];
 if(!best&&!lite)throw new Error('No Gemini Flash model is available for this key');
 S.models={t:Date.now(),best:best||lite,lite:lite||best};save();return S.models}
async function gem(parts,json=true){
 const m=await pickModels(),tryM=[m.best];if(m.lite&&m.lite!==m.best)tryM.push(m.lite);let err;
 for(const name of tryM){try{status('Asking '+name+'…','work');
   const j=await http(`https://generativelanguage.googleapis.com/v1beta/models/${name}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json',...KEYH()},body:JSON.stringify({contents:[{parts}],generationConfig:{temperature:.3,...(json?{responseMimeType:'application/json'}:{})}})}),
   t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
   if(!t.trim())throw new Error('Gemini returned no text ('+(j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||'empty reply')+')');
   if(!json)return t;try{return parseJSON(t)}catch(e){throw new Error('Gemini reply was not valid JSON ('+e.message+'). Try again.')}}
  catch(e){err=e;if(![429,404,503].includes(e.status)||name===tryM[tryM.length-1])throw e;S.models=null}}throw err}
const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
async function docxText(f){
 const u=new Uint8Array(await f.arrayBuffer()),dv=new DataView(u.buffer);let i=0;
 while(i<u.length-30&&dv.getUint32(i,true)===0x04034b50){const cm=dv.getUint16(i+8,true),cs=dv.getUint32(i+18,true),nl=dv.getUint16(i+26,true),el=dv.getUint16(i+28,true),nm=new TextDecoder().decode(u.slice(i+30,i+30+nl)),st=i+30+nl+el;
  if(nm==='word/document.xml'){const raw=u.slice(st,st+cs),x=await new Response(cm?new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw')):new Blob([raw]).stream()).text(),
   tx=r=>r.replace(/<w:tab\/>/g,'\t').replace(/<[^>]+>/g,'');
   return x.replace(/<w:r[ >](?:(?!<\/w:r>)[\s\S])*<\/w:r>/g,r=>{const t=tx(r);return t.trim()&&/<w:b\/>|<w:b w:val="(1|true)"/.test(r)?'**'+t+'**':t}).replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')}
  i=st+cs}throw new Error('Could not read this DOCX; try PDF or paste text')}
const filePart=async f=>/\.docx$/i.test(f.name)?{text:'RESUME TEXT:\n'+await docxText(f)}:{inlineData:{mimeType:f.type||'application/pdf',data:await b64(f)}};
/* ---------- prompts ---------- */
const SCHEMA=`{"name":"","sub":"gender/DOB line exactly as written","phone":"","email":"","sections":[{"title":"","note":"optional e.g. (52 MONTHS)","type":"entries|scholastic|skills|awards","entries":[{"dept":"","role":"","dates":"","style":"cells only for a 3-bordered-cell department row, else omit","sub":"optional full-width bold sub-row e.g. Project Title: ...","groups":[{"label":"Roles & Responsibilities","bullets":["text with **bold** words kept"]}]}],"cols":["Year","Degree","Institute","CGPA/%","Remarks"],"rows":"scholastic: [[cell,...]]; skills: [{\\"label\\":\\"\\",\\"text\\":\\"\\"}]; awards: [{\\"label\\":\\"Academic\\",\\"items\\":[{\\"texts\\":[\\"one or more side-by-side cells, with **bold**\\"],\\"year\\":\\"2020\\"}]}]"}]} (use only the keys relevant to each section type)`;
function checkResume(R,what='Resume'){const bad=m=>{throw new Error(what+' data problem: '+m)},T=v=>v==null?'':String(v);if(!R||typeof R!=='object')bad('not an object');if(!Array.isArray(R.sections)||!R.sections.length)bad('no sections');['name','sub','phone','email'].forEach(k=>R[k]=T(R[k]));
 R.sections.forEach((s,i)=>{if(!s||typeof s!=='object')bad('section '+(i+1)+' is invalid');s.title=T(s.title);if(s.note!=null)s.note=T(s.note);s.type=s.type||(s.cols?'scholastic':'entries');
  if(s.type==='scholastic'){s.rows=(Array.isArray(s.rows)?s.rows:[]).map(r=>(Array.isArray(r)?r:[]).map(T));if(s.cols)s.cols=s.cols.map(T)}
  else if(s.type==='skills')s.rows=(Array.isArray(s.rows)?s.rows:[]).map(r=>({label:T(r?.label),text:T(r?.text)}));
  else if(s.type==='awards')s.rows=(Array.isArray(s.rows)?s.rows:[]).map(r=>r?.items?{label:T(r.label),items:r.items.map(it=>({texts:(Array.isArray(it.texts)?it.texts:[it.text]).map(T),year:T(it.year)}))}:{label:T(r?.label),items:[{texts:[T(r?.text)],year:T(r?.year)}]});
  else{s.entries=Array.isArray(s.entries)?s.entries:[];s.entries.forEach((e,j)=>{['dept','role','dates'].forEach(k=>e[k]=T(e[k]));if(e.sub!=null)e.sub=T(e.sub);e.groups=Array.isArray(e.groups)?e.groups:[];e.groups.forEach(g=>{g.label=T(g.label);if(!Array.isArray(g.bullets))bad(`bullets missing in "${s.title}", entry ${j+1}`);g.bullets=g.bullets.map(b=>T(b&&typeof b==='object'?b.t:b))})})}});return R}
const plain=s=>String(s).replace(/\*\*/g,''),norm=t=>String(t??'').replace(/\b([A-Z])([A-Z]+)\b/g,(m,a,b)=>a+b.toLowerCase());
const fixR=R=>{if(!R||typeof R!=='object')return R;if(!Array.isArray(R.sections))R.sections=[];R.sections.forEach(s=>{if(!s||typeof s!=='object')return;if(!s.type)s.type=s.cols?'scholastic':'entries';if(s.type==='entries'){if(!Array.isArray(s.entries))s.entries=[];s.entries.forEach(e=>{if(!Array.isArray(e.groups))e.groups=[];e.groups.forEach(g=>{if(!Array.isArray(g.bullets))g.bullets=[]})})}else if(!Array.isArray(s.rows))s.rows=[]});return R};
const fixAll=()=>{if(!Array.isArray(S.versions))S.versions=[];if(!Array.isArray(S.wins))S.wins=[];if(!Array.isArray(S.apps))S.apps=[];if(!Array.isArray(S.undo))S.undo=[];[S.orig,S.master,...S.versions.map(v=>v.R)].forEach(fixR)};
const walk=(R,f)=>R.sections.forEach(s=>(s.entries||[]).forEach(e=>e.groups.forEach(g=>g.bullets=g.bullets.map(f))));
const withBudget=async R=>{let r={info:{}};try{r=await buildPDF(JSON.parse(JSON.stringify(R)))}catch(e){console.warn('measure failed',e)}const c=JSON.parse(JSON.stringify(R));walk(c,b=>{const i=r.info[plain(b)];if(!i){const n=plain(b).length,L=Math.max(1,Math.ceil(n/118));return{t:b,lines:L,chars:n,minChars:Math.round(n*.95),maxChars:Math.round(L*118*.97)}}const[mn,mx]=rng(i.L,i.aw),hi=Math.max(mx,i.len);return{t:b,lines:i.L,chars:i.len,lastLineFill:i.fill+'%',minChars:Math.min(mn,hi),maxChars:hi}});return c};
const RULES=`Rules: rewrite bullets ONE-FOR-ONE (same count, order, sections, entries, groups, labels, dates). NEVER invent facts, numbers, tools or employers: only reword, reorder, and add JD keywords that are TRUE for the candidate. Keep **bold** markers on key terms. Keep name, sub (gender/DOB line), phone, email EXACTLY. Every bullet is {"t","lines","chars","lastLineFill","minChars","maxChars"} (measured from the real layout): the plain text (without **) must stay between minChars and maxChars so the last line is filled and no extra line is added. If a bullet is short, add relevant true JD words to fill it. Return bullets as {"t":"..."} objects in the same shape.`;
const jdText=()=>`Company: ${$('#co').value}\nRole: ${$('#rl').value}\nContact: ${$('#ct').value}\nJOB DESCRIPTION:\n${$('#jd').value||'(see attached screenshots)'}`;
const tailorPrompt=async()=>`You are an expert resume editor. ${RULES}\nReturn ONLY JSON: {"resume":<same structure as the input>,"email":{"subject":"","body":"short recruiter email"},"cover":"cover letter, 3 short paragraphs, plain text, true facts only"}\nBoth the email and the cover letter must end with this signature block:\n${sig()}\n${jdText()}\n\nMASTER RESUME JSON:\n${JSON.stringify(await withBudget(S.master))}`;
const fitPrompt=()=>`Compare this resume with the job description. Return ONLY JSON: {"company":"company name from the JD","role":"job title from the JD","match":0-100,"verdict":"","matches":[],"gaps":[],"changes":["suggested resume changes"],"questions":["questions to ask the candidate"]}\n${jdText()}\n\nRESUME JSON:\n${JSON.stringify(S.master)}`;
const imgParts=async()=>Promise.all([...$('#jdimg').files].map(async f=>({inlineData:{mimeType:f.type,data:await b64(f)}})));
function merge(m,r){const o=JSON.parse(JSON.stringify(m)),g=(i,j,k)=>r?.sections?.[i]?.entries?.[j]?.groups?.[k]?.bullets||[];
 o.sections.forEach((s,i)=>{(s.entries||[]).forEach((e,j)=>e.groups.forEach((gr,k)=>{const a=g(i,j,k);gr.bullets=gr.bullets.map((b,x)=>{const v=a[x],t=typeof v==='string'?v:v?.t;return t||b})}));
  if(s.type==='skills'){const a=r?.sections?.[i]?.rows||[];s.rows=s.rows.map((x,j)=>({label:x.label,text:a[j]?.text||x.text}))}});return o}
/* ---------- Tailor tab ---------- */
const today=()=>new Date().toISOString().slice(0,10),needMaster=()=>{if(!S.master)throw new Error('Import your resume first (Resume tab)')};
const left=()=>10-(S.usage.d===today()?S.usage.n:0),showUse=()=>$('#usage').textContent=left()+' of 10 tailors left today';
const li=a=>'<ul>'+(a||[]).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
const cfgName=()=>(S.cfg.name||norm(S.master?.name)||'').trim();
const sig=()=>[cfgName(),[S.cfg.phone,S.cfg.email,S.cfg.linkedin].filter(Boolean).join(' | ')].filter(Boolean).join('\n');
const fileName=(kind,co,ext)=>{const n=cfgName()||'Resume',c=String(co||'').replace(/[\\/:*?"<>|]/g,'').trim(),k=kind==='cover'?'Cover Letter':'Resume';return [n,k,c].filter(Boolean).join(S.cfg.fileStyle==='space'?' ':'_')+'.'+ext};
const jdOnlyImg=()=>$('#jdimg').files.length>0&&!$('#jd').value.trim(),noJD=()=>{if(!$('#jd').value.trim()&&!$('#jdimg').files.length)throw new Error('Paste the job description or add screenshots first')};
const emailText=L=>{const b=String(L.email?.body||'');return(L.email?.subject?'Subject: '+L.email.subject+'\n\n':'')+b+(sig()&&!b.includes(cfgName())?'\n\n'+sig():'')};
const showFit=r=>{if(!r||typeof r!=='object')throw new Error('Fit result is empty');if(r.company&&!$('#co').value.trim())$('#co').value=String(r.company);if(r.role&&!$('#rl').value.trim())$('#rl').value=String(r.role);
 $('#out').innerHTML=`<div class="card"><h2>Fit</h2><div class="big">${esc(r.match)}%</div><p>${esc(r.verdict)}</p><b class="ok">Matches</b>${li(r.matches)}<b class="bad">Gaps</b>${li(r.gaps)}<b>Suggested changes</b>${li(r.changes)}<b>Questions</b>${li(r.questions)}</div>`};
$('#bfit').onclick=e=>busy(e.target,async()=>{needMaster();noJD();showFit(await gem([{text:fitPrompt()},...await imgParts()]))});

const importPrompt=()=>`Convert this resume into JSON exactly in this schema. Keep every word, the name, the gender/DOB line, and keep **bold** markers around words that are bold in bullets. Do not summarise. Name, section titles and section notes that are shown in small caps must be returned in Title Case (e.g. "Work Experience", "(52 Months)"); keep the gender/DOB line with its original letter case (e.g. "MALE, DOB: Dec 12th, 1996"). Return ONLY JSON.\n${SCHEMA}`;
let EV='master';const getR=id=>id==='orig'?S.orig:id==='master'?S.master:S.versions.find(v=>v.id===id)?.R,cur=()=>getR(EV),tabTo=t=>document.querySelector('nav a[data-t="'+t+'"]').click();
const rowsText=s=>(s.type==='scholastic'?[...(s.cols?.length?[s.cols.join(' | ')]:[]),...(s.rows||[]).map(r=>r.join(' | '))]:s.type==='skills'?(s.rows||[]).map(r=>r.label+' | '+r.text):(s.rows||[]).flatMap(r=>(r.items||[{texts:[r.text],year:r.year}]).map((it,k)=>(k?'':r.label||'')+' | '+it.texts.join(' ;; ')+' | '+it.year))).join('\n');
function setRows(s,v){const L=v.split('\n').filter(x=>x.trim()).map(l=>l.split('|').map(x=>x.trim()));if(s.type==='scholastic'){if(s.cols?.length)s.cols=L.shift()||[];s.rows=L}else if(s.type==='skills')s.rows=L.map(a=>({label:a[0],text:a.slice(1).join(' | ')}));else{s.rows=[];L.forEach(a=>{const it={texts:(a[1]||'').split(' ;; '),year:a[2]||''},p=s.rows.at(-1);if(!a[0]&&p)p.items.push(it);else s.rows.push({label:a[0],items:[it]})})}}
function previewHTML(R){if(!R)return'<div class="s">Nothing stored yet.</div>';const b=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');let h=`<div class="rv"><div class="rh"><div><span class="nm">${esc(norm(R.name))}</span><br>${esc(R.sub)}</div><div style="text-align:right">${esc(R.phone)}<br>${esc(R.email)}</div></div>`;
 (R.sections||[]).forEach(s=>{h+=`<div class="rs"><span>${esc(norm(s.title))}</span><span>${esc(norm(s.note))}</span></div>`;
  if(s.type==='scholastic')h+='<table>'+[s.cols,...(s.rows||[])].filter(Boolean).map((r,i)=>'<tr>'+r.map(c=>`<td style="text-align:center">${i===0&&s.cols?'<b>'+esc(c)+'</b>':b(c)}</td>`).join('')+'</tr>').join('')+'</table>';
  else if(s.type==='skills')h+='<table>'+(s.rows||[]).map(r=>`<tr><td class="l">${esc(r.label)}</td><td>${b(r.text)}</td></tr>`).join('')+'</table>';
  else if(s.type==='awards')h+='<table>'+(s.rows||[]).map(r=>{const its=r.items||[{texts:[r.text],year:r.year}];return its.map((it,k)=>`<tr>${k?'':`<td class="l" rowspan="${its.length}">${esc(r.label||'')}</td>`}<td>${(it.texts||[]).map(t=>'• '+b(t)).join(' &nbsp; ')}</td><td><i>${esc(it.year)}</i></td></tr>`).join('')}).join('')+'</table>';
  else(s.entries||[]).forEach(e=>{h+=`<table><tr class="t"><td colspan="2"><b>${esc(e.dept)}</b><span>${esc(e.dates)}</span><span>${esc(e.role)}</span></td></tr>${e.sub?`<tr class="t"><td colspan="2"><b>${esc(e.sub)}</b></td></tr>`:''}${(e.groups||[]).map(g=>`<tr><td class="l">${esc(g.label)}</td><td>${(g.bullets||[]).map(x=>'• '+b(x)).join('<br>')}</td></tr>`).join('')}</table>`})});return h+'</div>'}
const renderPreviews=()=>{for(const[id,R]of[['#pvm',S.master],['#pvo',S.orig]]){try{$(id).innerHTML=previewHTML(R)}catch(e){$(id).innerHTML='<div class="s bad">Preview failed: '+esc(e.message)+'</div>'}}};
function renderForm(){if(!cur())EV='master';const R=cur(),ro=EV==='orig'?' disabled':'';$('#vs').innerHTML='<option value="orig">Original (read-only)</option><option value="master">Master</option>'+S.versions.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('');$('#vs').value=EV;
